<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Rýchly dopyt</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#f6f8f2,#e9f2df);color:#111827}.bg{padding:38px;max-width:760px}.tag{display:inline-block;padding:8px 12px;border-radius:999px;background:#eef8d8;color:#33520f;font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.bg h1{font-size:clamp(38px,7vw,76px);line-height:.9;letter-spacing:-.08em;margin:18px 0 12px}.bg p{color:#647067;font-size:18px;line-height:1.6;font-weight:650}.w{position:fixed;right:24px;bottom:24px;width:min(430px,calc(100vw - 28px));height:min(720px,calc(100vh - 48px));background:#fff;border:1px solid #dfe8d7;border-radius:30px;box-shadow:0 32px 90px -40px rgba(16,34,27,.65);overflow:hidden;display:flex;flex-direction:column}.h{padding:17px;background:radial-gradient(circle at 20% 0%,rgba(150,215,56,.35),transparent 38%),linear-gradient(135deg,#10221b,#173429);color:#fff}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{display:flex;gap:12px;align-items:center}.m{width:43px;height:43px;border-radius:16px;background:linear-gradient(135deg,#a3e635,#65a30d);display:grid;place-items:center;color:#10210a;font-weight:950}.brand b{display:block;font-weight:950}.brand small{color:rgba(255,255,255,.72);font-weight:700}.x{width:34px;height:34px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;border-radius:13px;font-size:20px}.p{height:8px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:15px}.bar{height:100%;background:linear-gradient(90deg,#a3e635,#d9ff7a);transition:.25s}.b{flex:1;overflow:auto;padding:18px;background:linear-gradient(#fff,#f8fbf5)}.step{font-size:11px;font-weight:950;color:#8b9a8d;letter-spacing:.09em;text-transform:uppercase;margin-bottom:7px}h2{font-size:25px;line-height:1.05;letter-spacing:-.055em;margin:0 0 8px}.hint{font-size:13.5px;line-height:1.45;color:#647067;font-weight:650;margin:0 0 15px}.g{display:grid;gap:10px}.two{grid-template-columns:1fr 1fr}.card,.chip,.inp,.price,.sum{border:1.4px solid rgba(16,34,27,.11);background:linear-gradient(#fff,#fbfdf9);box-shadow:0 18px 38px -32px rgba(16,34,27,.7)}button,input,textarea{font:inherit}.card{min-height:94px;padding:14px;border-radius:21px;text-align:left;cursor:pointer;transition:.18s}.card:hover,.card.on{transform:translateY(-2px);border-color:#7fb321;background:linear-gradient(#fff,#f4fbe8);box-shadow:0 0 0 3px rgba(163,230,53,.18),0 22px 42px -31px rgba(16,34,27,.75)}.card b{display:block;font-weight:950;letter-spacing:-.025em}.card small{display:block;margin-top:5px;color:#647067;font-size:12.5px;line-height:1.35;font-weight:700}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border-radius:999px;padding:10px 13px;font-weight:900;cursor:pointer;color:#21342a}.chip.on,.chip:hover{background:#f4fbe8;border-color:#7fb321;color:#31500f;box-shadow:0 0 0 3px rgba(163,230,53,.18)}.lbl{display:block;font-size:12px;color:#58685d;font-weight:900;margin:12px 0 6px}.inp{width:100%;border-radius:17px;padding:13px 14px;font-weight:760;outline:none}textarea.inp{min-height:82px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.amt{border:1.4px solid rgba(16,34,27,.11);border-radius:24px;background:linear-gradient(#fff,#f7faf5);padding:15px;box-shadow:0 22px 48px -34px rgba(16,34,27,.78)}.read{display:flex;justify-content:space-between;gap:10px}.read b{font-size:19px;font-weight:950}.read small{display:block;color:#647067;font-weight:700}.pill{background:#10221b;color:#fff;border-radius:999px;padding:8px 10px;font-size:12px;font-weight:950;white-space:nowrap}.scene{height:112px;border-radius:20px;border:1px solid rgba(16,34,27,.09);background:linear-gradient(135deg,#f8faf5,#eaf2e4);position:relative;overflow:hidden;margin:12px 0}.scene:before{content:"";position:absolute;inset:0 auto 0 0;width:calc(var(--pct)*100%);background:linear-gradient(90deg,rgba(163,230,53,.35),transparent)}.boxes{position:absolute;inset:0;display:flex;align-items:flex-end;gap:7px;padding:15px}.box{width:34px;border-radius:9px 9px 5px 5px;background:linear-gradient(#a3e635,#65a30d)}.box:nth-child(2n){background:linear-gradient(#173429,#10221b)}.box:nth-child(3n){background:linear-gradient(#fff,#dce7d4);border:1px solid #d2dfca}.sl{width:100%;accent-color:#65a30d}.price{border-radius:23px;padding:14px;margin-bottom:12px}.pt{display:flex;justify-content:space-between;border-bottom:1px solid #e4ecd9;padding-bottom:12px}.pt span{color:#8b9a8d;font-size:11px;font-weight:950;letter-spacing:.08em;text-transform:uppercase}.pt b{font-size:26px;letter-spacing:-.05em}.line{display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:750;color:#26362d;margin-top:8px}.line small{display:block;color:#91a092}.total{margin-top:12px;padding:13px 14px;border-radius:18px;background:linear-gradient(135deg,#10221b,#173429);color:#fff;display:flex;justify-content:space-between;font-weight:950}.sum{border-radius:21px;padding:13px;display:grid;gap:9px}.sr{display:flex;justify-content:space-between;gap:10px;font-size:13px}.sr span:first-child{color:#657368;font-weight:850}.sr span:last-child{text-align:right;font-weight:930}.note{border-radius:16px;background:#f4fbe8;border:1px solid #d8efb8;color:#334d13;padding:11px 12px;font-size:12.5px;line-height:1.45;font-weight:760;margin-top:12px}.f{display:flex;gap:10px;padding:13px 16px;background:#fff;border-top:1px solid #e4ecd9}.back,.next{min-height:54px;border-radius:18px;border:0;padding:0 15px;font-weight:950;cursor:pointer}.back{background:#fff;border:1px solid #dfe8d7;color:#21342a}.next{flex:1;background:linear-gradient(135deg,#a3e635,#bef264,#65a30d);color:#10210a;box-shadow:0 18px 36px -22px rgba(101,163,13,.82)}.next:disabled{opacity:.45;box-shadow:none}.toast{display:none;background:#ecfdf5;border:1px solid #bbf7d0;color:#065f46;border-radius:16px;padding:12px;font-weight:850;margin-top:10px;font-size:13px}.gd{display:flex;gap:8px;color:#647067;font-size:12px;font-weight:700;margin-top:12px}.open{position:fixed;right:22px;bottom:22px;border:0;border-radius:999px;background:#10221b;color:#fff;padding:14px 18px;font-weight:950;display:none}@media(max-width:560px){.bg{display:none}.w{inset:0;width:100vw;height:100vh;border-radius:0}.two,.row{grid-template-columns:1fr}}
</style></head><body><main class="bg"><span class="tag">jedno okno</span><h1>Rýchly dopyt bez chaosu.</h1><p>Všetko prebieha v jednom plávajúcom okne. Žiadne presmerovanie, žiadne druhé okno, žiadny názov cenový poradca.</p></main><button class="open" id="op">Otvoriť dopyt</button><section class="w" id="w"><div class="h"><div class="top"><div class="brand"><div class="m">RD</div><div><b>Rýchly dopyt</b><small>odhad a podklady pre firmu</small></div></div><button class="x" id="cl">×</button></div><div class="p"><div class="bar" id="bar"></div></div></div><div class="b" id="body"></div><div class="f"><button class="back" id="back">Späť</button><button class="next" id="next">Pokračovať</button></div></section><script>
const s={step:0,service:'',space:'',area:45,amount:28,spec:{},floor:0,elev:'yes',park:'near',dateMode:'standard',from:'',to:'',date:'',crew:'crew2',name:'',phone:'',email:'',note:'',gdpr:false};
const steps=['Služba','Priestor','Množstvo','Prístup','Kontakt'],services={moving:['Sťahovanie','byt, dom alebo kancelária'],clearance:['Vypratanie','pivnica, byt, dom, sklad'],single:['Odvoz vecí','nábytok, spotrebiče, krabice'],waste:['Vývoz odpadu','vrecia alebo zmiešaný odpad']},spaces={room:['Jedna izba','menší rozsah'],flat:['Byt','1–3 izbový byt'],house:['Rodinný dom','väčší rozsah'],cellar:['Pivnica / garáž','horší prístup'],office:['Kancelária','stoly, archív, technika'],other:['Iné','doplníte v poznámke']},amounts={12:['Pár kusov','1–3 veci alebo pár vriec'],28:['Menší náklad','sedačka, skriňa, krabice'],48:['Jedna izba','viac nábytku z izby'],68:['1–2 izbový byt','viac miestností'],90:['Celý byt / dom','veľa vecí alebo viac jázd']};
const $=x=>document.querySelector(x),esc=x=>String(x??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));function near(){return Object.keys(amounts).map(Number).reduce((a,b)=>Math.abs(b-s.amount)<Math.abs(a-s.amount)?b:a,12)}function at(){return amounts[near()][0]}function boxes(){let n=Math.max(3,Math.min(14,Math.round(s.amount/8)+2)),h='';for(let i=0;i<n;i++)h+=`<span class="box" style="height:${28+((i*17+n*5)%54)}px"></span>`;return h}
function price(){let b={moving:95,clearance:110,single:55,waste:75}[s.service]||70,l=[['Základ',services[s.service]?.[0]||'služba',b]],sa={room:15,flat:35,house:75,cellar:35,office:55,other:25}[s.space]||0;if(sa){b+=sa;l.push(['Priestor',spaces[s.space]?.[0]||'',sa])}let a=Math.round((Number(s.area)||0)*(s.service==='single'?0.38:.72));if(a){b+=a;l.push(['Rozsah',s.area+' m²',a])}let am=Math.round(s.amount*1.45);b+=am;l.push(['Množstvo',at(),am]);const sp={piano:['Klavír',75],safe:['Sejf',60],fragile:['Krehké veci',25],oversized:['Nadrozmer',40]};Object.keys(s.spec).forEach(k=>{if(s.spec[k]&&sp[k]){b+=sp[k][1];l.push(['Špeciálne',sp[k][0],sp[k][1]])}});if(s.floor>0){let f=s.floor*6;b+=f;l.push(['Poschodie',s.floor+' × 6 €',f])}if(s.elev==='no'){b+=14;l.push(['Výťah','bez výťahu',14])}if(s.park==='far'){b+=10;l.push(['Parkovanie','ďalej od vchodu',10])}if(s.park==='blocked'){b+=24;l.push(['Parkovanie','bez státia',24])}if(s.crew==='self'){b-=25;l.push(['Posádka','len doprava',-25])}if(s.crew==='crew3'){b+=30;l.push(['Posádka','3 ľudia',30])}if(s.crew==='crew4'){b+=65;l.push(['Posádka','4+ ľudia',65])}if(s.dateMode==='flex'){b*=.93;l.push(['Termín','flexibilne −7 %',0])}if(s.dateMode==='rush'){b*=1.12;l.push(['Termín','súrne / víkend +12 %',0])}return{min:Math.round(b*.94/5)*5,max:Math.round(b*1.06/5)*5,lines:l}}
function c(g,id,v){return `<button class="card ${s[g]===id?'on':''}" data-${g}="${id}"><b>${esc(v[0])}</b><small>${esc(v[1])}</small></button>`}function valid(){if(s.step===0)return s.service;if(s.step===1)return s.space;if(s.step===4)return s.phone.trim().length>=7&&s.gdpr;return true}
function render(){let p=price();$('#bar').style.width=((s.step+1)/steps.length*100)+'%';$('#back').style.visibility=s.step?'visible':'hidden';$('#next').textContent=s.step===4?'Odoslať dopyt':'Pokračovať';$('#next').disabled=!valid();let h=`<div class="step">Krok ${s.step+1} z ${steps.length} · ${steps[s.step]}</div>`;if(s.step===0)h+=`<h2>Čo má firma spraviť?</h2><p class="hint">Jasný výber služby bez technických názvov.</p><div class="g two">${Object.entries(services).map(x=>c('service',x[0],x[1])).join('')}</div>`;if(s.step===1)h+=`<h2>O aký priestor ide?</h2><p class="hint">Podľa priestoru sa odhadne rozsah práce, nosenie a čas.</p><div class="g two">${Object.entries(spaces).map(x=>c('space',x[0],x[1])).join('')}</div><div class="row"><div><label class="lbl">Rozloha</label><input class="inp" id="area" type="number" value="${s.area}"></div><div><label class="lbl">Detail</label><input class="inp" id="noteShort" value="${esc(s.note)}" placeholder="napr. úzke schody"></div></div>`;if(s.step===2){let pct=Math.max(.05,Math.min(1,s.amount/100));h+=`<h2>Koľko vecí treba zobrať?</h2><p class="hint">Bez dodávky a m³. Vyberte scenár podľa toho, čo reálne vidíte.</p><div class="amt" style="--pct:${pct}"><div class="read"><div><b>${at()}</b><small>${amounts[near()][1]}</small></div><span class="pill">${p.min} – ${p.max} €</span></div><div class="scene"><div class="boxes">${boxes()}</div></div><input class="sl" id="amount" type="range" min="5" max="100" value="${s.amount}"><div class="g two">${Object.entries(amounts).map(([v,a])=>`<button class="card ${near()==Number(v)?'on':''}" data-amount="${v}"><b>${a[0]}</b><small>${a[1]}</small></button>`).join('')}</div></div><label class="lbl">Špeciálne veci</label><div class="chips">${[['piano','Klavír'],['safe','Sejf'],['fragile','Krehké'],['oversized','Nadrozmer']].map(x=>`<button class="chip ${s.spec[x[0]]?'on':''}" data-spec="${x[0]}">${x[1]}</button>`).join('')}</div>`}if(s.step===3)h+=`<h2>Prístup a termín</h2><p class="hint">Poschodie, výťah a parkovanie často rozhodujú o výslednej cene.</p><div class="row"><input class="inp" id="from" value="${esc(s.from)}" placeholder="Odkiaľ"><input class="inp" id="to" value="${esc(s.to)}" placeholder="Kam"></div><div class="row"><input class="inp" id="floor" type="number" value="${s.floor}" placeholder="Poschodie"><input class="inp" id="date" type="date" value="${s.date}"></div><label class="lbl">Výťah</label><div class="chips"><button class="chip ${s.elev==='yes'?'on':''}" data-elev="yes">Je výťah</button><button class="chip ${s.elev==='no'?'on':''}" data-elev="no">Bez výťahu</button></div><label class="lbl">Parkovanie</label><div class="chips"><button class="chip ${s.park==='near'?'on':''}" data-park="near">Pri vchode</button><button class="chip ${s.park==='far'?'on':''}" data-park="far">Ďalej</button><button class="chip ${s.park==='blocked'?'on':''}" data-park="blocked">Bez státia</button></div><label class="lbl">Termín</label><div class="chips"><button class="chip ${s.dateMode==='flex'?'on':''}" data-date="flex">Flex −7 %</button><button class="chip ${s.dateMode==='standard'?'on':''}" data-date="standard">Štandard</button><button class="chip ${s.dateMode==='rush'?'on':''}" data-date="rush">Súrne +12 %</button></div><label class="lbl">Posádka</label><div class="chips"><button class="chip ${s.crew==='self'?'on':''}" data-crew="self">Len doprava</button><button class="chip ${s.crew==='crew2'?'on':''}" data-crew="crew2">2 ľudia</button><button class="chip ${s.crew==='crew3'?'on':''}" data-crew="crew3">3 ľudia</button><button class="chip ${s.crew==='crew4'?'on':''}" data-crew="crew4">4+ ľudia</button></div>`;if(s.step===4)h+=`<h2>Kontrola dopytu</h2><p class="hint">Zhrnutie je písané tak, aby bolo použiteľné pre firmu aj zákazníka.</p>${priceHtml(p)}<div class="sum"><div class="sr"><span>Práca</span><span>${esc(services[s.service]?.[0])}</span></div><div class="sr"><span>Priestor</span><span>${esc(spaces[s.space]?.[0])} · ${s.area} m²</span></div><div class="sr"><span>Množstvo</span><span>${at()}</span></div><div class="sr"><span>Prístup</span><span>${s.floor}. posch., ${s.elev==='yes'?'výťah':'bez výťahu'}, ${s.park}</span></div><div class="sr"><span>Trasa</span><span>${esc(s.from||'—')}${s.to?' → '+esc(s.to):''}</span></div></div><div class="row"><input class="inp" id="name" value="${esc(s.name)}" placeholder="Meno"><input class="inp" id="phone" value="${esc(s.phone)}" placeholder="Telefón *"></div><input class="inp" id="email" value="${esc(s.email)}" placeholder="E-mail"><textarea class="inp" id="note" placeholder="Detaily, fotky, čas…">${esc(s.note)}</textarea><label class="gd"><input id="gdpr" type="checkbox" ${s.gdpr?'checked':''}> Súhlas so spracovaním údajov na vybavenie dopytu.</label><div class="toast" id="toast">Dopyt je pripravený.</div>`;$('#body').innerHTML=h;bind()}
function priceHtml(p){return `<div class="price"><div class="pt"><div><span>Odhad podľa výberu</span><b>${p.min} – ${p.max} €</b></div><i class="pill">bez záväzku</i></div>${p.lines.map(l=>`<div class="line"><span>${esc(l[0])}<small>${esc(l[1])}</small></span><b>${l[2]?((l[2]>0?'+':'')+l[2]+' €'):''}</b></div>`).join('')}<div class="total"><span>Spolu</span><span>${p.min} – ${p.max} €</span></div><div class="note">Cena sa ešte spresní podľa fotiek, reálneho prístupu a telefonického potvrdenia.</div></div>`}
function bind(){document.querySelectorAll('[data-service]').forEach(b=>b.onclick=()=>{s.service=b.dataset.service;render()});document.querySelectorAll('[data-space]').forEach(b=>b.onclick=()=>{s.space=b.dataset.space;s.area={room:22,flat:55,house:120,cellar:28,office:70,other:45}[s.space];render()});document.querySelectorAll('[data-amount]').forEach(b=>b.onclick=()=>{s.amount=Number(b.dataset.amount);render()});document.querySelectorAll('[data-spec]').forEach(b=>b.onclick=()=>{s.spec[b.dataset.spec]=!s.spec[b.dataset.spec];render()});document.querySelectorAll('[data-elev]').forEach(b=>b.onclick=()=>{s.elev=b.dataset.elev;render()});document.querySelectorAll('[data-park]').forEach(b=>b.onclick=()=>{s.park=b.dataset.park;render()});document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{s.dateMode=b.dataset.date;render()});document.querySelectorAll('[data-crew]').forEach(b=>b.onclick=()=>{s.crew=b.dataset.crew;render()});['area','amount','floor','from','to','date','name','phone','email','note','noteShort'].forEach(id=>{let e=$('#'+id);if(e)e.oninput=()=>{let k=id==='noteShort'?'note':id;s[k]=(id==='area'||id==='amount'||id==='floor')?Number(e.value||0):e.value;$('#next').disabled=!valid();if(id==='amount')render()}});let g=$('#gdpr');if(g)g.onchange=()=>{s.gdpr=g.checked;$('#next').disabled=!valid()}}
$('#back').onclick=()=>{if(s.step>0){s.step--;render()}};$('#next').onclick=()=>{if(!valid())return;if(s.step<4){s.step++;render()}else{$('#toast').style.display='block'}};$('#cl').onclick=()=>{$('#w').style.display='none';$('#op').style.display='block'};$('#op').onclick=()=>{$('#w').style.display='flex';$('#op').style.display='none'};render();
</script></body></html>
