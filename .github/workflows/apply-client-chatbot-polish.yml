name: Apply client chatbot polish

on:
  workflow_dispatch:
  push:
    branches:
      - claude/new-chatbot-design-JrtOE
    paths:
      - '.github/workflows/apply-client-chatbot-polish.yml'
      - '.github/client-polish-trigger.txt'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/new-chatbot-design-JrtOE
      - name: Patch index.html quantity step, pricing and MojPlot-like UI
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          css = r'''

