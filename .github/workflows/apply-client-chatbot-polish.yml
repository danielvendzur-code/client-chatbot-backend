  overflow: hidden !important;
}
.cbw-pb-label { text-transform: uppercase !important; letter-spacing: .075em !important; font-size: 11px !important; color: #64748b !important; font-weight: 950 !important; }
.cbw-pb-range, .cbw-pb-total-amount { font-weight: 950 !important; letter-spacing: -.04em !important; color:#0f172a !important; }
.cbw-pb-total { margin-top:12px !important; border-radius:18px !important; background:linear-gradient(135deg,#1f2633 0%,#2c3445 100%) !important; color:#fff !important; padding:14px 16px !important; }
.cbw-pb-total-label, .cbw-pb-total-amount { color:#fff !important; }
.cbw-pb-note { background:#fff7ed !important; border:1px solid #fed7aa !important; color:#7c2d12 !important; border-radius:16px !important; }
@media (max-width: 520px) {
  .cbw-panel { width:100vw !important; height:100dvh !important; max-height:none !important; border-radius:0 !important; right:0 !important; bottom:0 !important; }
  .cbw-root { right:16px !important; bottom:16px !important; }
