.cbw-amount-sub { display:block; font-size:13px; color:#64748b; font-weight:700; margin-top:3px; }
.cbw-amount-price { flex:0 0 auto; border-radius:999px; padding:8px 11px; background:#1f2633; color:#fff; font-size:12.5px; font-weight:950; box-shadow:0 12px 24px -18px rgba(15,23,42,.82); }
.cbw-amount-scene { position:relative; min-height:112px; border-radius:20px; overflow:hidden; background:radial-gradient(circle at 20% 0%, rgba(251,178,70,.26), transparent 38%), linear-gradient(135deg,#f8fafc 0%,#eef2f7 100%); border:1px solid rgba(15,23,42,.08); margin:12px 0 14px; }
.cbw-amount-scene::before { content:""; position:absolute; left:0; top:0; bottom:0; width:calc(var(--amount-pct, .35) * 100%); background:linear-gradient(90deg, rgba(251,178,70,.34), rgba(251,178,70,.08)); transition:width .22s ease; }
.cbw-amount-boxes { position:absolute; inset:0; display:flex; align-items:flex-end; gap:7px; padding:16px; }
.cbw-amount-box { display:block; width:34px; border-radius:8px 8px 5px 5px; background:linear-gradient(180deg,#fbb246,#d97706); box-shadow:inset 0 1px 0 rgba(255,255,255,.34), 0 10px 18px -16px rgba(15,23,42,.84); transform:translateY(0); }
.cbw-amount-box:nth-child(2n) { background:linear-gradient(180deg,#2c3445,#1f2633); }
.cbw-amount-box:nth-child(3n) { background:linear-gradient(180deg,#ffffff,#e2e8f0); border:1px solid rgba(15,23,42,.12); }
.cbw-amount-meter { height:9px; border-radius:999px; background:#e2e8f0; overflow:hidden; margin:10px 0 10px; }
.cbw-amount-meter-fill { display:block; height:100%; width:calc(var(--amount-pct, .35) * 100%); border-radius:999px; background:linear-gradient(90deg,#fbb246,#e49b31); transition:width .22s ease; }
.cbw-amount-presets { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin:12px 0 12px; }
.cbw-amount-preset { text-align:left; border:1.5px solid rgba(15,23,42,.10); background:#fff; border-radius:17px; padding:12px; font:inherit; cursor:pointer; box-shadow:0 14px 30px -26px rgba(15,23,42,.76); transition:all .18s ease; }
.cbw-amount-preset strong { display:block; color:#0f172a; font-size:13.5px; font-weight:950; letter-spacing:-.025em; }
.cbw-amount-preset small { display:block; margin-top:3px; color:#64748b; font-size:12px; font-weight:700; line-height:1.3; }
.cbw-amount-preset[aria-pressed="true"], .cbw-amount-preset:hover { border-color:#fbb246; background:#fff7ed; box-shadow:var(--cbw-mp-ring), 0 16px 30px -24px rgba(15,23,42,.76); transform:translateY(-1px); }
.cbw-amount-help { margin-top:10px; padding:11px 12px; border-radius:16px; background:#fff7ed; border:1px solid #fed7aa; color:#7c2d12; font-size:12.5px; font-weight:750; line-height:1.45; }
.cbw-vol-slider { accent-color:#e49b31 !important; }
.cbw-pb, .cbw-bd {
