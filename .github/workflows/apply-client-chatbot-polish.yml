name: Apply client chatbot polish

on:
  workflow_dispatch:
  push:
    branches:
      - claude/new-chatbot-design-JrtOE
    paths:
      - '.github/workflows/apply-client-chatbot-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/new-chatbot-design-JrtOE
      - name: Patch index.html pricing and MojPlot-like UI
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          css = r'''

/* MOJPLOT-LIKE CLIENT POLISH 2026-07-04 */
:root {
  --cbw-premium-shadow: 0 18px 44px -30px rgba(15,23,42,.72);
  --cbw-premium-ring: 0 0 0 3px rgba(251,178,70,.18);
}
.cbw-panel {
  width: min(430px, calc(100vw - 28px)) !important;
  border: 1px solid rgba(15,23,42,.10) !important;
  box-shadow: 0 34px 90px -34px rgba(15,23,42,.48), 0 14px 40px -24px rgba(44,52,69,.38) !important;
}
.cbw-header.cbw-brand-gradient {
  min-height: 76px !important;
  background-image: radial-gradient(circle at 18% 0%, rgba(251,178,70,.30), transparent 34%), linear-gradient(135deg, #1f2633 0%, #2c3445 58%, #111827 100%) !important;
}
.cbw-calc-prompt {
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif !important;
  font-size: 21px !important;
  font-weight: 900 !important;
  letter-spacing: -.04em !important;
}
.cbw-calc-hint {
  font-size: 13.5px !important;
  color: #64748b !important;
  font-weight: 650 !important;
}
.cbw-chip,
.cbw-filter-chip,
.cbw-search-result-chip,
.cbw-selected-pill,
.cbw-add-custom,
.cbw-small-btn {
  min-height: 38px !important;
  padding: 9px 13px !important;
  border-radius: 999px !important;
  border: 1px solid rgba(44,52,69,.16) !important;
  background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%) !important;
  color: #1f2633 !important;
  font-weight: 850 !important;
  box-shadow: 0 10px 24px -22px rgba(15,23,42,.72) !important;
}
.cbw-chip:hover,
.cbw-filter-chip:hover,
.cbw-search-result-chip:hover,
.cbw-selected-pill:hover,
.cbw-add-custom:hover,
.cbw-small-btn:hover {
  transform: translateY(-1px) !important;
  border-color: rgba(251,178,70,.76) !important;
  background: linear-gradient(180deg, #fffaf1 0%, #fff2dc 100%) !important;
  color: #7c2d12 !important;
  box-shadow: var(--cbw-premium-ring), 0 14px 30px -24px rgba(15,23,42,.78) !important;
}
.cbw-choice-opt,
.cbw-svc-card,
.cbw-dir-card,
.cbw-preset-btn,
.cbw-q-card,
.cbw-result-option {
  border-radius: 20px !important;
  border: 1.5px solid rgba(15,23,42,.10) !important;
  background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%) !important;
  box-shadow: var(--cbw-premium-shadow) !important;
}
.cbw-choice-opt:hover,
.cbw-choice-opt:focus-visible,
.cbw-svc-card:hover,
.cbw-dir-card:hover,
.cbw-preset-btn:hover,
.cbw-q-card:hover,
.cbw-result-option:hover {
  transform: translateY(-2px) !important;
  border-color: rgba(251,178,70,.78) !important;
  box-shadow: var(--cbw-premium-ring), 0 22px 42px -30px rgba(15,23,42,.72) !important;
}
.cbw-choice-opt[aria-pressed="true"],
.cbw-svc-card[aria-pressed="true"],
.cbw-dir-card[aria-pressed="true"],
.cbw-preset-btn[aria-pressed="true"],
.cbw-q-card[aria-pressed="true"],
.cbw-result-option[aria-pressed="true"] {
  border-color: #fbb246 !important;
  background: linear-gradient(180deg, #fffaf1 0%, #fff2dc 100%) !important;
  box-shadow: 0 0 0 3px rgba(251,178,70,.22), 0 18px 40px -28px rgba(15,23,42,.72) !important;
}
.cbw-svc-icon-wrap,
.cbw-choice-opt-icon,
.cbw-result-icon,
.cbw-preset-icon {
  border-radius: 16px !important;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 10px 22px -18px rgba(15,23,42,.70) !important;
}
.cbw-calc-foot {
  padding: 12px 14px max(14px, env(safe-area-inset-bottom, 14px)) !important;
  background: linear-gradient(180deg, rgba(255,255,255,.82) 0%, #ffffff 100%) !important;
  border-top: 1px solid rgba(15,23,42,.08) !important;
  box-shadow: 0 -18px 36px -34px rgba(15,23,42,.70) !important;
}
.cbw-calc-back-btn {
  min-height: 48px !important;
  border-radius: 16px !important;
  font-weight: 850 !important;
  border: 1px solid rgba(15,23,42,.10) !important;
  background: #ffffff !important;
  color: #2c3445 !important;
}
.cbw-calc-next-btn,
.cbw-next-priced {
  min-height: 52px !important;
  border-radius: 17px !important;
  padding: 13px 16px !important;
  font-size: 15px !important;
  font-weight: 950 !important;
  letter-spacing: -.01em !important;
  background-image: linear-gradient(135deg, #fbb246 0%, #e49b31 48%, #b86f0d 100%) !important;
  color: #fff !important;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.36), 0 16px 34px -20px rgba(184,111,13,.76) !important;
}
.cbw-calc-next-btn:hover,
.cbw-next-priced:hover {
  transform: translateY(-1px) !important;
  filter: brightness(1.045) !important;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.40), 0 20px 42px -22px rgba(184,111,13,.82) !important;
}
.cbw-calc-next-btn:disabled {
  opacity: .52 !important;
  filter: grayscale(.16) !important;
  transform: none !important;
  box-shadow: none !important;
}
.cbw-next-price {
  margin-left: 8px !important;
  background: rgba(255,255,255,.20) !important;
  border: 1px solid rgba(255,255,255,.26) !important;
  padding: 4px 9px !important;
  border-radius: 999px !important;
  font-weight: 950 !important;
}
.cbw-pb {
  border: 1px solid rgba(15,23,42,.10) !important;
  border-radius: 24px !important;
  background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%) !important;
  box-shadow: 0 24px 56px -32px rgba(15,23,42,.55) !important;
  overflow: hidden !important;
}
.cbw-pb-head {
  padding-bottom: 13px !important;
  border-bottom: 1px solid rgba(15,23,42,.08) !important;
}
.cbw-pb-label {
  text-transform: uppercase !important;
  letter-spacing: .075em !important;
  font-size: 11px !important;
  color: #64748b !important;
  font-weight: 950 !important;
}
.cbw-pb-range {
  font-size: 26px !important;
  letter-spacing: -.045em !important;
  color: #0f172a !important;
  font-weight: 950 !important;
}
.cbw-pb-row {
  border-bottom: 1px solid rgba(15,23,42,.06) !important;
}
.cbw-pb-total {
  margin-top: 12px !important;
  border-radius: 18px !important;
  background: linear-gradient(135deg, #1f2633 0%, #2c3445 100%) !important;
  color: #fff !important;
  padding: 14px 16px !important;
}
.cbw-pb-total-label,
.cbw-pb-total-amount { color: #fff !important; }
.cbw-pb-note {
  background: #fff7ed !important;
  border: 1px solid #fed7aa !important;
  color: #7c2d12 !important;
  border-radius: 16px !important;
}
@media (max-width: 520px) {
  .cbw-panel { width: 100vw !important; height: 100dvh !important; max-height: none !important; border-radius: 0 !important; right: 0 !important; bottom: 0 !important; }
  .cbw-root { right: 16px !important; bottom: 16px !important; }
  .cbw-pb-range { font-size: 22px !important; }
  .cbw-q-cards, .cbw-svc-grid, .cbw-dir-grid { gap: 9px !important; }
}
'''
          if '/* MOJPLOT-LIKE CLIENT POLISH 2026-07-04 */' not in text:
              text = text.replace('</style>', css + '\n</style>')

          replacements = {
            '1 + Math.min(2.2, (quantity - 1) * 0.32)': '1 + Math.min(1.65, (quantity - 1) * 0.22)',
            '1 + Math.min(1.8, (quantity - 1) * 0.24)': '1 + Math.min(1.65, (quantity - 1) * 0.22)',
            'Number(jobType.rate || 2.6)': 'Number(jobType.rate || 2.15)',
            'Number(jobType.rate || 2.2)': 'Number(jobType.rate || 2.15)',
            'area * m2Rate + itemBase * 0.45': 'area * m2Rate + itemBase * 0.32',
            'area * m2Rate + itemBase * 0.35': 'area * m2Rate + itemBase * 0.32',
            'itemBase * 0.45': 'itemBase * 0.32',
            'itemBase * 0.35': 'itemBase * 0.32',
            "total += 25; lines.push({ label: 'Schody / horšia manipulácia', sub: '', amount: 25 });": "total += 18; lines.push({ label: 'Schody / horšia manipulácia', sub: '', amount: 18 });",
            "total += 20; lines.push({ label: 'Schody / horšia manipulácia', sub: '', amount: 20 });": "total += 18; lines.push({ label: 'Schody / horšia manipulácia', sub: '', amount: 18 });",
            "total += 45; lines.push({ label: 'Náročný prístup',               sub: '', amount: 45 });": "total += 32; lines.push({ label: 'Náročný prístup',               sub: '', amount: 32 });",
            "total += 35; lines.push({ label: 'Náročný prístup',               sub: '', amount: 35 });": "total += 32; lines.push({ label: 'Náročný prístup',               sub: '', amount: 32 });",
            "total += 20; lines.push({ label: 'Bez výťahu',                    sub: '', amount: 20 });": "total += 14; lines.push({ label: 'Bez výťahu',                    sub: '', amount: 14 });",
            "total += 15; lines.push({ label: 'Bez výťahu',                    sub: '', amount: 15 });": "total += 14; lines.push({ label: 'Bez výťahu',                    sub: '', amount: 14 });",
            'floors * 8': 'floors * 6',
            'floors * 6': 'floors * 6',
            "floors + '× 8 €'": "floors + '× 6 €'",
            "total += 15; lines.push({ label: 'Parkovanie ďalej od vchodu', sub: '', amount: 15 });": "total += 10; lines.push({ label: 'Parkovanie ďalej od vchodu', sub: '', amount: 10 });",
            'roundTo5(vol * 2.2)': 'roundTo5(vol * 1.75)',
            'roundTo5(vol * 1.85)': 'roundTo5(vol * 1.75)',
            "piano: ['Klavír', 90]": "piano: ['Klavír', 75]",
            "safe: ['Sejf', 70]": "safe: ['Sejf', 60]",
            "aquarium: ['Akvárium', 35]": "aquarium: ['Akvárium', 30]",
            "fragile: ['Krehké veci', 30]": "fragile: ['Krehké veci', 25]",
            "oversized: ['Nadrozmer', 50]": "oversized: ['Nadrozmer', 40]",
            "total += 30; lines.push({ label: 'Parkovanie blokované', sub: '', amount: 30 });": "total += 24; lines.push({ label: 'Parkovanie blokované', sub: '', amount: 24 });",
            "total += 25; lines.push({ label: 'Špeciálne ťažké kusy', sub: '', amount: 25 });": "total += 18; lines.push({ label: 'Špeciálne ťažké kusy', sub: '', amount: 18 });",
            'Math.round(area * 1.4)': 'Math.round(area * 1.05)',
            'Math.round(area * 1.1)': 'Math.round(area * 1.05)',
            "area + ' m² × 1,40 €'": "area + ' m² × 1,05 €'",
            "area + ' m² × 1,10 €'": "area + ' m² × 1,05 €'",
            "crew_3: { count: 3, sub: '3 ľudia', extra: 40 }": "crew_3: { count: 3, sub: '3 ľudia', extra: 30 }",
            "crew_4: { count: 4, sub: '4+ ľudia', extra: 90 }": "crew_4: { count: 4, sub: '4+ ľudia', extra: 65 }",
            'roundTo5(total * 0.90)': 'roundTo5(total * 0.94)',
            'roundTo5(total * 0.92)': 'roundTo5(total * 0.94)',
            'roundTo5(total * 1.15)': 'roundTo5(total * 1.06)',
            'roundTo5(total * 1.08)': 'roundTo5(total * 1.06)',
            '<span class="cbw-pb-label">Orientačný odhad</span>': '<span class="cbw-pb-label">Presnejší odhad podľa výberu</span>',
            '<span class="cbw-pb-label">Presnejší odhad podľa výberu</span>': '<span class="cbw-pb-label">Presnejší odhad podľa výberu</span>',
            'Finálnu cenu vám potvrdíme telefonicky alebo po obhliadke — bez záväzku, do 30 minút v pracovných hodinách.': 'Cena sa počíta z položiek, objemu, poschodia, prístupu, PSČ a termínu. Finálnu cenu potvrdíme telefonicky alebo po fotke nábytku.'
          }
          changed = 0
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
                  changed += 1
              else:
                  print('MISS:', old[:120])
          p.write_text(text, encoding='utf-8')
          print('Applied replacements:', changed)
          PY
      - name: Commit patched index.html
        run: |
          if git diff --quiet; then echo "No changes to commit"; exit 0; fi
          git config user.name "chatgpt-codex"
          git config user.email "chatgpt-codex@users.noreply.github.com"
          git add index.html
          git commit -m "Make client chatbot match MojPlot style"
          git push origin HEAD:claude/new-chatbot-design-JrtOE
