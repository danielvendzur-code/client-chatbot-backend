}
'''
          if '/* MOJPLOT CLIENT UI HARD POLISH 2026-07-04 */' not in text:
              text = text.replace('</style>', css + '\n</style>')

          new_volume_block = r'''
function amountReadout(v) {
  const labels = [
    [0, 20, 'Pár kusov',        '1–3 veci, pár vriec alebo menší nábytok'],
    [20, 38, 'Menší náklad',    'sedačka, skriňa, stôl alebo viac krabíc'],
    [38, 58, 'Jedna izba',      'väčší kusový nábytok a viac doplnkov'],
    [58, 78, '1–2 izbový byt',  'viac miestností, viac nosenia a skladania'],
    [78, 101, 'Celý byt / dom', 'veľa vecí, viac práce alebo viac jázd']
  ];
  return labels.find(l => v >= l[0] && v < l[1]) || labels[0];
}

function amountBoxScene(v) {
  const count = Math.max(3, Math.min(14, Math.round(v / 8) + 2));
  let boxes = '';
  for (let i = 0; i < count; i++) {
    const h = 28 + ((i * 13 + count * 7) % 52);
    boxes += '<span class="cbw-amount-box" style="height:' + h + 'px"></span>';
  }
  return boxes;
}

function closestAmountPreset(v) {
  const presets = [12, 28, 48, 68, 90];
  return presets.reduce(function(best, cur) {
    return Math.abs(cur - v) < Math.abs(best - v) ? cur : best;
  }, presets[0]);
}

function wizVolume(d, price) {
  const v = Math.max(5, Math.min(100, Number(d.volume) || 28));
  const cur = amountReadout(v);
  const active = closestAmountPreset(v);
  const pct = Math.max(.05, Math.min(1, v / 100));
  const presets = [
    [12, 'Pár kusov',       '1–3 veci / pár vriec'],
    [28, 'Menší náklad',   'sedačka, skriňa, krabice'],
    [48, 'Jedna izba',     'viac nábytku z izby'],
    [68, '1–2 izbový byt', 'viac miestností'],
    [90, 'Celý byt / dom', 'veľa vecí / viac jázd']
  ];
  return '<div class="cbw-amount-panel" style="--amount-pct:' + pct + '">'
    + '<div class="cbw-amount-head">'
    +   '<div><span class="cbw-amount-kicker">Množstvo vecí</span><span class="cbw-amount-title">' + escapeHtml(cur[2]) + '</span><span class="cbw-amount-sub">' + escapeHtml(cur[3]) + '</span></div>'
    +   '<div class="cbw-amount-price">' + price.min + ' – ' + price.max + ' €</div>'
    + '</div>'
    + '<div class="cbw-amount-scene" style="--amount-pct:' + pct + '"><div class="cbw-amount-boxes">' + amountBoxScene(v) + '</div></div>'
    + '<div class="cbw-amount-meter"><span class="cbw-amount-meter-fill"></span></div>'
    + '<input type="range" class="cbw-vol-slider" id="cbwVolume" min="5" max="100" step="1" value="' + v + '" aria-label="Množstvo vecí">'
    + '<div class="cbw-amount-presets">'
    + presets.map(function(p) {
        return '<button type="button" class="cbw-amount-preset" data-volume-preset="' + p[0] + '" aria-pressed="' + (active === p[0]) + '"><strong>' + escapeHtml(p[1]) + '</strong><small>' + escapeHtml(p[2]) + '</small></button>';
      }).join('')
    + '</div>'
    + '<div class="cbw-amount-help"><strong>Tip:</strong> Nemusíte poznať m³ ani veľkosť dodávky. Vyberte najbližší scenár podľa toho, koľko vecí vidíte. Fotky v ďalšom kroku cenu ešte spresnia.</div>'
    + '<div class="cbw-sec-sublabel" style="margin-top:14px">Špeciálne predmety</div>'
    + '<div class="cbw-chip-row">'
    + [['piano','Klavír'],['safe','Sejf'],['aquarium','Akvárium'],['fragile','Krehké veci'],['oversized','Nadrozmer']]
        .map(function(s) {
          const on = !!(d.specials || {})[s[0]];
          return '<button type="button" class="cbw-chip-spec" data-special="' + s[0] + '" aria-pressed="' + on + '">' + escapeHtml(s[1]) + '</button>';
        })
        .join('')
    + '</div>'
    + '</div>';
}

'''
          text, n = re.subn(r'function volumeReadout\(v\) \{.*?\n\}\n\nfunction wizVolume\(d, price\) \{.*?\n\}\n\n// ───── STEP 4', new_volume_block + '// ───── STEP 4', text, flags=re.S)
          print('volume block replacements:', n)

          new_update_live = r'''function updateVanLive() {
  updateAmountLive();
}

function updateAmountLive() {
  const v = Math.max(5, Math.min(100, Number(calc.data.volume) || 28));
  const pct = Math.max(.05, Math.min(1, v / 100));
  const cur = amountReadout(v);
  const scene = document.querySelector('.cbw-amount-scene');
  const panel = document.querySelector('.cbw-amount-panel');
  const meter = document.querySelector('.cbw-amount-meter');
  if (scene) scene.style.setProperty('--amount-pct', pct);
  if (panel) panel.style.setProperty('--amount-pct', pct);
  if (meter) meter.style.setProperty('--amount-pct', pct);
  const title = document.querySelector('.cbw-amount-title');
  const sub = document.querySelector('.cbw-amount-sub');
  if (title) title.textContent = cur[2];
  if (sub) sub.textContent = cur[3];
  const boxes = document.querySelector('.cbw-amount-boxes');
  if (boxes) boxes.innerHTML = amountBoxScene(v);
  const active = closestAmountPreset(v);
  document.querySelectorAll('[data-volume-preset]').forEach(function(btn) {
    btn.setAttribute('aria-pressed', String(Number(btn.dataset.volumePreset) === active));
  });
  updateNextPriceLive();
}

let _lastNextPrice'''
          text, n = re.subn(r'function updateVanLive\(\) \{.*?\n\}\n\nlet _lastNextPrice', new_update_live, text, flags=re.S)
          print('live updater replacements:', n)

          old_vol_event = """  const vol = document.getElementById('cbwVolume');\n  if (vol) vol.addEventListener('input', function (e) {\n    calc.data.volume = Number(e.target.value) || 0;\n    updateVanLive();\n    updateMiniSticky();\n  });\n\n  bind('[data-special]', 'click', function (e) {"""
          new_vol_event = """  const vol = document.getElementById('cbwVolume');\n  if (vol) vol.addEventListener('input', function (e) {\n    calc.data.volume = Number(e.target.value) || 0;\n    updateAmountLive();\n    updateMiniSticky();\n  });\n\n  bind('[data-volume-preset]', 'click', function (e) {\n    calc.data.volume = Number(e.currentTarget.dataset.volumePreset) || 28;\n    renderCalc({ preserveScroll: true });\n  });\n\n  bind('[data-special]', 'click', function (e) {"""
          if old_vol_event in text:
              text = text.replace(old_vol_event, new_vol_event)
              print('volume events replaced: 1')
          else:
              print('MISS volume event block')

          replacements = {
            '1 + Math.min(2.2, (quantity - 1) * 0.32)': '1 + Math.min(1.55, (quantity - 1) * 0.20)',
            '1 + Math.min(1.8, (quantity - 1) * 0.24)': '1 + Math.min(1.55, (quantity - 1) * 0.20)',
            'Number(jobType.rate || 2.6)': 'Number(jobType.rate || 2.05)',
            'area * m2Rate + itemBase * 0.45': 'area * m2Rate + itemBase * 0.30',
            'itemBase * 0.45': 'itemBase * 0.30',
            "total += 45; lines.push({ label: 'Kancelárska réžia', sub: '', amount: 45 });": "total += 35; lines.push({ label: 'Kancelárska réžia', sub: '', amount: 35 });",
            'Math.max(0, Number(d.floors) || 0) * 12': 'Math.max(0, Number(d.floors) || 0) * 8',
            "(d.floors || 0) + '× 12 €'": "(d.floors || 0) + '× 8 €'",
            "total += 25; lines.push({ label: 'Schody / horšia manipulácia', sub: '', amount: 25 });": "total += 18; lines.push({ label: 'Schody / horšia manipulácia', sub: '', amount: 18 });",
            "total += 45; lines.push({ label: 'Náročný prístup',               sub: '', amount: 45 });": "total += 32; lines.push({ label: 'Náročný prístup',               sub: '', amount: 32 });",
            "total += 20; lines.push({ label: 'Bez výťahu',                    sub: '', amount: 20 });": "total += 14; lines.push({ label: 'Bez výťahu',                    sub: '', amount: 14 });",
            'floors * 8': 'floors * 6',
            "floors + '× 8 €'": "floors + '× 6 €'",
            "total += 15; lines.push({ label: 'Parkovanie ďalej od vchodu', sub: '', amount: 15 });": "total += 10; lines.push({ label: 'Parkovanie ďalej od vchodu', sub: '', amount: 10 });",
            "total += 35; lines.push({ label: 'Ťažší náklad', sub: '', amount: 35 });": "total += 25; lines.push({ label: 'Ťažší náklad', sub: '', amount: 25 });",
            'roundTo5(vol * 2.2)': 'roundTo5(vol * 1.55)',
            "lines.push({ label: 'Objem nákladu', sub: volSub + ' dodávky', amount: volAmount });": "lines.push({ label: 'Množstvo vecí', sub: amountReadout(vol)[2], amount: volAmount });",
            "piano: ['Klavír', 90]": "piano: ['Klavír', 75]",
            "safe: ['Sejf', 70]": "safe: ['Sejf', 60]",
            "aquarium: ['Akvárium', 35]": "aquarium: ['Akvárium', 30]",
            "fragile: ['Krehké veci', 30]": "fragile: ['Krehké veci', 25]",
            "oversized: ['Nadrozmer', 50]": "oversized: ['Nadrozmer', 40]",
            "total += 30; lines.push({ label: 'Parkovanie blokované', sub: '', amount: 30 });": "total += 24; lines.push({ label: 'Parkovanie blokované', sub: '', amount: 24 });",
            "total += 25; lines.push({ label: 'Špeciálne ťažké kusy', sub: '', amount: 25 });": "total += 18; lines.push({ label: 'Špeciálne ťažké kusy', sub: '', amount: 18 });",
            "crew_3: { count: 3, sub: '3 ľudia', extra: 40 }": "crew_3: { count: 3, sub: '3 ľudia', extra: 30 }",
            "crew_4: { count: 4, sub: '4+ ľudia', extra: 90 }": "crew_4: { count: 4, sub: '4+ ľudia', extra: 65 }",
            "if (d.dateMode === 'rush')      { total *= 1.15; dateMultLabel = 'Súrne / víkend +15 %'; }": "if (d.dateMode === 'rush')      { total *= 1.12; dateMultLabel = 'Súrne / víkend +12 %'; }",
            "else if (d.dateMode === 'flex') { total *= 0.90; dateMultLabel = 'Flexibilný termín −10 %'; }": "else if (d.dateMode === 'flex') { total *= 0.93; dateMultLabel = 'Flexibilný termín −7 %'; }",
            "const min = Math.max(0, roundTo5(total * 0.90));": "const min = Math.max(0, roundTo5(total * 0.94));",
            "const max = roundTo5(total * 1.15);": "const max = roundTo5(total * 1.06);",
            '<span class="cbw-pb-label">Orientačný odhad</span>': '<span class="cbw-pb-label">Presnejší odhad podľa výberu</span>',
            'Finálnu cenu vám potvrdíme telefonicky alebo po obhliadke — bez záväzku, do 30 minút v pracovných hodinách.': 'Cena sa počíta z priestoru, množstva vecí, poschodia, prístupu, PSČ a termínu. Fotky alebo krátky telefonát ju ešte spresnia.'
          }
          changed = 0
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
                  changed += 1
              else:
                  print('MISS:', old[:120])
          print('simple replacements:', changed)

          old_area = """    // Area (m²) — adds 1.4 €/m² up to a soft 200 m² cap to keep estimates sane\n    const area = Math.max(0, Math.min(2000, Number(d.areaM2) || 0));\n    if (area > 0) {\n      const aAmount = Math.round(area * 1.4);\n      total += aAmount;\n      lines.push({ label: 'Rozloha priestoru', sub: area + ' m² × 1,40 €', amount: aAmount });\n    }"""
          new_area = """    // Area (m²) — for non-space jobs only; space jobs already include m² above.\n    const area = Math.max(0, Math.min(2000, Number(d.areaM2) || 0));\n    if (area > 0 && !isSpacePriceJob()) {\n      const aAmount = Math.round(area * 0.95);\n      total += aAmount;\n      lines.push({ label: 'Rozloha priestoru', sub: area + ' m² × 0,95 €', amount: aAmount });\n    }"""
          if old_area in text:
              text = text.replace(old_area, new_area)
              print('area block replaced: 1')
          else:
              print('MISS area block')

          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit patched index.html
        run: |
          if git diff --quiet; then echo "No changes to commit"; exit 0; fi
          git config user.name "chatgpt-codex"
          git config user.email "chatgpt-codex@users.noreply.github.com"
          git add index.html
          git commit -m "Improve quantity step pricing and MojPlot UI"
          git push origin HEAD:claude/new-chatbot-design-JrtOE
